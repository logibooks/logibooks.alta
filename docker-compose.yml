name: logibooks-alta

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: EnterpriseDeveloper
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      PATH: /opt/mssql-tools18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sql-state:/var/opt/mssql
      - type: bind
        source: ${ALTA_REESTR_DIR:-D:/Projects/logibooks/AltaDB/reestr_1_1}
        target: /database
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          sqlcmd -S localhost -U sa -d reestr_1
          -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  adminer:
    image: adminer:5.5.0-standalone
    environment:
      ADMINER_DEFAULT_SERVER: mssql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8083}:8080"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql-state:
    external: true
    name: ${ALTA_SQL_STATE_VOLUME:-alta-reestr-1-1-sql-state}
