name: logibooks-alta

x-alta-development-backup: &alta-development-backup
  type: bind
  source: ${ALTA_DEV_BASELINE_BAK:-./.local/alta/reestr_1-dev.bak}
  target: /baseline/reestr_1.bak
  read_only: true
  bind:
    create_host_path: false

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: EnterpriseDeveloper
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      PATH: /opt/mssql-tools18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sql-dev-state:/var/opt/mssql
      - *alta-development-backup
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          sqlcmd -S localhost -U sa -d master
          -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mssql-init:
    build:
      context: .
      dockerfile: integration/DevTool.Dockerfile
    command: [initialize]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      ALTA_DB_PASSWORD: ${ALTA_DB_PASSWORD:-}
      ALTA_DEV_WRITER_PASSWORD: ${ALTA_DEV_WRITER_PASSWORD:-}
    volumes:
      - type: bind
        source: ${ALTA_DEV_BASELINE_BAK:-./.local/alta/reestr_1-dev.bak}.manifest.json
        target: /baseline/reestr_1.bak.manifest.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mssql:
        condition: service_healthy

  adminer:
    image: adminer:5.5.0-standalone
    environment:
      ADMINER_DEFAULT_SERVER: mssql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8083}:8080"
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sql-dev-state:
