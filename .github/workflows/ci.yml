name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build-test-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Logibooks.Alta.Tests/Logibooks.Alta.Tests.csproj

      - name: Run cross-platform tests
        run: >-
          dotnet test ./Logibooks.Alta.Tests/Logibooks.Alta.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"

      - name: Validate restore script and Compose model
        run: |
          bash -n ./docker/mssql/restore-gtk.sh
          docker compose --env-file .env.example config --quiet

      - name: Build development images
        run: |
          docker compose --env-file .env.example build adapter adminer
          expected=$(dotnet msbuild ./Logibooks.Alta.Service/Logibooks.Alta.Service.csproj -nologo -getProperty:Version)
          actual=$(docker compose --env-file .env.example run --rm --no-deps -T adapter --version)
          if [ "$actual" != "$expected" ]; then
            echo "Expected adapter version '$expected', got '$actual'." >&2
            exit 1
          fi

  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Logibooks.Alta.sln

      - name: Test
        run: >-
          dotnet test .\Logibooks.Alta.Tests\Logibooks.Alta.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"

      - name: Build Windows setup EXE
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Configuration Release

      - name: Smoke-test the Windows service install
        shell: pwsh
        run: |
          $setup = '.\Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe'
          $uninstaller = "$env:ProgramFiles\Logibooks\Alta\unins000.exe"
          $config = "$env:ProgramData\Logibooks\Alta\appsettings.json"
          $logs = "$env:ProgramData\Logibooks\Alta\Logs\alta-*.log"
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          try {
            foreach ($attempt in 1..2) {
              $install = Start-Process -FilePath $setup -ArgumentList "/ALLUSERS $silent" -WindowStyle Hidden -Wait -PassThru
              if ($install.ExitCode -ne 0) { throw "Service setup failed with exit code $($install.ExitCode)." }
              $service = Get-Service -Name LogibooksAltaAdapter
              try {
                $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
              } finally {
                $service.Dispose()
              }
              if ($attempt -eq 1) {
                $deadline = [DateTime]::UtcNow.AddSeconds(15)
                while (!(Get-Content -Path $logs -ErrorAction SilentlyContinue | Select-String -Pattern 'Logibooks Alta Adapter version .+ started' -Quiet)) {
                  if ([DateTime]::UtcNow -ge $deadline) { throw 'The Windows service did not write its startup log.' }
                  Start-Sleep -Seconds 1
                }
                Add-Content -LiteralPath $config -Value ' '
                $configHash = (Get-FileHash -LiteralPath $config).Hash
              } elseif ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) {
                throw 'Service reinstall replaced the configuration.'
              }
            }
          } finally {
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $silent -WindowStyle Hidden -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Service uninstall failed with exit code $($uninstall.ExitCode)." }
            }
          }
          if (Get-Service -Name LogibooksAltaAdapter -ErrorAction SilentlyContinue) { throw 'Uninstall left the service registered.' }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) { throw 'Uninstall changed the configuration.' }

      - name: Upload Windows setup EXE
        uses: actions/upload-artifact@v6
        with:
          name: Logibooks.Alta.Setup
          path: Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe
          if-no-files-found: error
