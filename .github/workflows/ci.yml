name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build-test-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Logibooks.Alta.Tests/Logibooks.Alta.Tests.csproj

      - name: Run cross-platform tests
        run: >-
          dotnet test ./Logibooks.Alta.Tests/Logibooks.Alta.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"

      - name: Validate Compose
        env:
          MSSQL_SA_PASSWORD: ComposeValidationOnly_Aa1!
        run: docker compose --env-file .env.example config --quiet

  build-test-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Logibooks.Alta.sln

      - name: Test
        run: >-
          dotnet test .\Logibooks.Alta.Tests\Logibooks.Alta.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"

      # CI builds the installer only to validate the build and smoke-test installation.
      - name: Build Windows setup EXE
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Configuration Release

      - name: Smoke-test the per-user console install
        shell: pwsh
        run: |
          $setup = '.\Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe'
          $app = "$env:LOCALAPPDATA\Programs\Logibooks\Alta"
          $uninstaller = Join-Path $app 'unins000.exe'
          $config = "$env:LOCALAPPDATA\Logibooks\Alta\appsettings.json"
          $logs = "$env:LOCALAPPDATA\Logibooks\Alta\Logs\alta-*.log"
          $shortcuts = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Logibooks"
          $startShortcut = Join-Path $shortcuts 'Start Alta adapter in console mode.lnk'
          $configShortcut = Join-Path $shortcuts 'Open Alta adapter configuration.lnk'
          $output = Join-Path $env:RUNNER_TEMP 'alta-console.stdout.log'
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          try {
            $install = Start-Process -FilePath $setup -ArgumentList "/CURRENTUSER /LANG=english $silent" -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Console setup failed with exit code $($install.ExitCode)." }
            if (!(Test-Path -LiteralPath $startShortcut) -or !(Test-Path -LiteralPath $configShortcut)) {
              throw 'Console setup did not create both Start menu shortcuts.'
            }

            $console = Start-Process -FilePath $env:ComSpec -ArgumentList '/d /c Run-Alta.cmd' `
              -WorkingDirectory $app -RedirectStandardOutput $output -WindowStyle Hidden -PassThru
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              $message = 'Integration monitoring is disabled; waiting for configuration'
              while ($true) {
                if ($console.HasExited) { throw "The console adapter exited with code $($console.ExitCode)." }
                $consoleLogged = Get-Content -Path $output -ErrorAction SilentlyContinue | Select-String -SimpleMatch $message -Quiet
                $fileLogged = Get-Content -Path $logs -ErrorAction SilentlyContinue | Select-String -SimpleMatch $message -Quiet
                if ($consoleLogged -and $fileLogged) { break }
                if ([DateTime]::UtcNow -ge $deadline) { throw 'The console adapter did not log to the console and user profile.' }
                Start-Sleep -Seconds 1
              }
            } finally {
              if (!$console.HasExited) {
                $console.Kill($true)
                $console.WaitForExit()
              }
              $console.Dispose()
            }

            Add-Content -LiteralPath $config -Value ' '
            $configHash = (Get-FileHash -LiteralPath $config).Hash
            $reinstall = Start-Process -FilePath $setup -ArgumentList "/CURRENTUSER /LANG=english $silent" -WindowStyle Hidden -Wait -PassThru
            if ($reinstall.ExitCode -ne 0) { throw "Console reinstall failed with exit code $($reinstall.ExitCode)." }
            if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) { throw 'Console reinstall replaced the configuration.' }
          } finally {
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $silent -WindowStyle Hidden -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Console uninstall failed with exit code $($uninstall.ExitCode)." }
            }
          }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) { throw 'Console uninstall changed the configuration.' }
          if ((Test-Path -LiteralPath $startShortcut) -or (Test-Path -LiteralPath $configShortcut)) { throw 'Console uninstall left a shortcut.' }
          if (Get-Service -Name LogibooksAltaAdapter -ErrorAction SilentlyContinue) { throw 'Console setup registered a service.' }

      - name: Smoke-test the Windows service install
        shell: pwsh
        run: |
          $setup = '.\Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe'
          $uninstaller = "$env:ProgramFiles\Logibooks\Alta\unins000.exe"
          $config = "$env:ProgramData\Logibooks\Alta\appsettings.json"
          $logs = "$env:ProgramData\Logibooks\Alta\Logs\alta-*.log"
          $silent = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          try {
            foreach ($attempt in 1..2) {
              $setupArguments = if ($attempt -eq 1) { $silent } else { "/ALLUSERS $silent" }
              $install = Start-Process -FilePath $setup -ArgumentList $setupArguments -WindowStyle Hidden -Wait -PassThru
              if ($install.ExitCode -ne 0) { throw "Service setup failed with exit code $($install.ExitCode)." }
              $service = Get-Service -Name LogibooksAltaAdapter
              try {
                $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
              } finally {
                $service.Dispose()
              }
              if ($attempt -eq 1) {
                $deadline = [DateTime]::UtcNow.AddSeconds(15)
                while (!(Get-Content -Path $logs -ErrorAction SilentlyContinue | Select-String -Pattern 'Logibooks Alta Adapter version .+ started' -Quiet)) {
                  if ([DateTime]::UtcNow -ge $deadline) { throw 'The Windows service did not write its startup log.' }
                  Start-Sleep -Seconds 1
                }
                Add-Content -LiteralPath $config -Value ' '
                $configHash = (Get-FileHash -LiteralPath $config).Hash
              } elseif ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) {
                throw 'Service reinstall replaced the configuration.'
              }
            }
          } finally {
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $silent -WindowStyle Hidden -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Service uninstall failed with exit code $($uninstall.ExitCode)." }
            }
          }
          if (Get-Service -Name LogibooksAltaAdapter -ErrorAction SilentlyContinue) { throw 'Uninstall left the service registered.' }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $configHash) { throw 'Uninstall changed the configuration.' }
