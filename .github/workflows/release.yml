name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set application version from release tag
        shell: pwsh
        run: .\scripts\Set-ReleaseVersion.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Restore
        run: dotnet restore .\Logibooks.Alta.sln

      - name: Test
        run: >-
          dotnet test .\Logibooks.Alta.Tests\Logibooks.Alta.Tests.csproj
          --configuration Release
          --no-restore

      - name: Build Windows setup EXE
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Configuration Release

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $setup = '.\Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *Logibooks.Alta.Adapter.Setup.exe" | Set-Content "$setup.sha256" -Encoding ascii

      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-default-branch

      - name: Commit version to default branch
        shell: pwsh
        working-directory: release-default-branch
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ..\scripts\Set-ReleaseVersion.ps1 -Tag $env:GITHUB_REF_NAME -OnlyIncrease
          if (git status --porcelain -- Directory.Build.props) {
            git add -- Directory.Build.props
            git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore: bump version to $($env:GITHUB_REF_NAME.Substring(1))"
            git push origin "HEAD:refs/heads/$env:RELEASE_DEFAULT_BRANCH"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          '.\Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe'
          '.\Logibooks.Alta.Setup\Release\Logibooks.Alta.Adapter.Setup.exe.sha256'
          --verify-tag
          --generate-notes
          --title "Logibooks Alta Adapter $env:GITHUB_REF_NAME"
