services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: logibooks
      POSTGRES_USER: postgres
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'The Logibooks PostgreSQL data directory is empty. Set LOGIBOOKS_CORE_PGDATA to the existing cluster.' >&2
          exit 1
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    command: [postgres]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: ${LOGIBOOKS_CORE_PGDATA:-../.pgdata}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, pg_isready, -h, localhost, -U, postgres, -d, logibooks]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    environment:
      ADMINER_DEFAULT_SERVER: db

  core:
    build:
      context: ${LOGIBOOKS_CORE_DIR:-../core}
      dockerfile: Logibooks.Core/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection
      - AltaMonitoring__DatabaseNames__0=reestr_1
      - AltaMonitoring__WriterUserIds__reestr_1
      - QzPrinting__Enabled=false
    ports:
      - "127.0.0.1:${LOGIBOOKS_TEST_CORE_PORT:-18080}:8080"
    volumes:
      - integration-images:/var/data/parcel-images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://localhost:8080/api/status/status]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: ${LOGIBOOKS_UI_DIR:-../ui}
      args:
        API_URL: /api
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    ports:
      - "127.0.0.1:${LOGIBOOKS_TEST_UI_PORT:-18082}:8080"
    volumes:
      - ./integration/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/status/status]
      interval: 120s
      timeout: 5s
      retries: 5

  alta:
    build:
      context: .
      dockerfile: integration/Alta.Dockerfile
    labels:
      com.microsoft.visual-studio.project-name: Logibooks.Alta.Service
    # Alta allows HTTP Core URLs only for localhost in Development.
    network_mode: service:core
    environment:
      DOTNET_ENVIRONMENT: Development
      Service__Enabled: ${ALTA_TEST_MONITORING:-false}
      Core__BaseUrl: http://localhost:8080
      Core__Enabled: ${Core__Enabled:-false}
      Core__Email: ${Core__Email:-}
      Core__Password: ${Core__Password:-}
      Databases__Targets__0__Name: reestr_1
      Databases__Targets__0__ConnectionString: >-
        ${ALTA_SQL_CONNECTION_STRING:-Server=mssql,1433;Database=reestr_1;User ID=logibooks;Password="${ALTA_DB_PASSWORD:-}";Encrypt=True;TrustServerCertificate=True}
    stdin_open: true
    tty: true
    cap_add: [SYS_PTRACE]
    depends_on:
      core:
        condition: service_healthy
        restart: true
      mssql:
        condition: service_healthy

volumes:
  integration-images:

